services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
      target: production
    restart: unless-stopped
    environment:
      PORT: "2567"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      BOT_THINK_MIN_MS: "${BOT_THINK_MIN_MS:-1800}"
      BOT_THINK_MAX_MS: "${BOT_THINK_MAX_MS:-3200}"
      LOCAL_TRANSITION_DELAY_MS: "${LOCAL_TRANSITION_DELAY_MS:-5000}"
    ports:
      - "2567:2567"
    depends_on:
      - redis

  web:
    build:
      context: ./client
      target: production
      args:
        VITE_SERVER_URL: "${VITE_SERVER_URL:-}"
        VITE_SERVER_HTTP_URL: "${VITE_SERVER_HTTP_URL:-}"
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
