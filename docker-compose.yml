version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
    working_dir: /app
    command: sh -lc "npm install && npm run dev"
    volumes:
      - ./server:/app
    ports:
      - "2567:2567"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  client:
    build:
      context: ./client
    working_dir: /app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 80"
    volumes:
      - ./client:/app
    ports:
      - "3000:80"
    depends_on:
      - server
