name: Validate contributions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      migration_comparison:
        description: Run one bounded old/new migration comparison on a non-main branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

jobs:
  dependency-audit:
    name: "1 · Dependency audit"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3

      - name: Audit CI and development dependencies
        run: npm audit

      - name: Audit server production dependencies
        run: npm --prefix server audit --omit=dev

      - name: Audit client production dependencies
        run: npm --prefix client audit --omit=dev

  configuration:
    name: "1 · Deployment configuration"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_IMAGE: node:22-alpine
      NGINX_IMAGE: nginx:1.27-alpine
      CORS_ALLOWED_ORIGINS: https://sise.example.com
      PUBLIC_WEB_ORIGIN: https://sise.example.com
      VITE_SERVER_URL: wss://sise-api.example.com
      VITE_SERVER_HTTP_URL: https://sise-api.example.com
      TRAEFIK_WEB_RULE: Host(`sise.example.com`)
      TRAEFIK_SERVER_RULE: Host(`sise-api.example.com`)
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3

      - name: Verify CI failure and identity contracts without dependencies
        run: npm run ci:self-test

      - name: Validate Compose configurations
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.traefik.yml config --quiet
          npm run compose:imac:check


  build:
    name: "Fast · Prepare verified application"
    needs: [configuration, dependency-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Install locked CI dependencies once
        run: npm run install:ci
      - name: Build and verify the same checkout
        run: |
          node scripts/ci/record.mjs build -- npm run build
          node scripts/ci/record.mjs docs -- npm run check:docs
          node scripts/ci/record.mjs generated -- npm run check:generated
          git diff --exit-code
      - name: Validate complete test ownership
        run: node scripts/ci/record.mjs coverage -- npm run ci:coverage
      - name: Seal application and dependency artifact
        run: node scripts/ci/artifact.mjs pack
      - uses: actions/upload-artifact@v7
        with:
          name: ci-bundle
          path: |
            ci-bundle.tar.gz
            ci-bundle.json
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: ci-identity
          path: ci-bundle.json
          retention-days: 7
      - name: Retain preparation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-prepare-${{ github.run_attempt }}
          path: output/ci-migration/
          if-no-files-found: warn
          retention-days: 7

  unit:
    name: "Fast · Rules, state and protocol"
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@v8
        with:
          name: ci-bundle
      - run: node scripts/ci/artifact.mjs restore
      - run: npm run ci:consumer
      - name: Run deterministic checks without browser installation or services
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/no-browser-installation
        run: node scripts/ci/record.mjs unit -- npm run ci:unit
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-unit-${{ github.run_attempt }}
          path: output/ci-migration/
          if-no-files-found: warn
          retention-days: 7

  integration:
    name: "Full · Isolated services and HTTP"
    needs: [build, unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      analytics-test-redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ANALYTICS_TEST_REDIS_URL: redis://127.0.0.1:6379
      PLAYWRIGHT_BROWSERS_PATH: /tmp/no-browser-installation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@v8
        with:
          name: ci-bundle
      - run: node scripts/ci/artifact.mjs restore
      - run: npm run ci:consumer
      - name: Exercise real isolated Redis and HTTP without a browser or frontend
        run: node scripts/ci/record.mjs services -- npm run ci:services
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-services-${{ github.run_attempt }}
          path: output/ci-migration/
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: "Full · Browser ${{ matrix.label }}"
    needs: [build, unit, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --shm-size=1g
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: contracts-chromium-1, layer: contracts, project: chromium, shard: 1/3 }
          - { label: contracts-chromium-2, layer: contracts, project: chromium, shard: 2/3 }
          - { label: contracts-chromium-3, layer: contracts, project: chromium, shard: 3/3 }
          - { label: contracts-webkit-1, layer: contracts, project: webkit-responsive, shard: 1/2 }
          - { label: contracts-webkit-2, layer: contracts, project: webkit-responsive, shard: 2/2 }
          - { label: experience-chromium, layer: experience, project: chromium, shard: 1/1 }
          - { label: experience-webkit, layer: experience, project: webkit-responsive, shard: 1/1 }
    env:
      CI_BROWSER_LAYER: ${{ matrix.layer }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@v8
        with:
          name: ci-bundle
      - run: node scripts/ci/artifact.mjs restore
      - name: Verify native dependencies and the image's locked browser revisions
        run: npm run ci:consumer -- --browsers
      - name: Run original browser assertions with real time and no retries
        run: node scripts/ci/record.mjs browser-${{ matrix.label }} -- npm run ci:browser -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Preserve first-attempt result, logs, traces and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-browser-${{ matrix.label }}-${{ github.run_attempt }}
          path: output/ci-migration/
          if-no-files-found: warn
          retention-days: 7

  container-build:
    needs: [build, unit, integration, browser, configuration, dependency-audit]
    name: "3 · Production containers"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_IMAGE: node:22-alpine
      NGINX_IMAGE: nginx:1.27-alpine
      CORS_ALLOWED_ORIGINS: https://sise.example.com
      PUBLIC_WEB_ORIGIN: https://sise.example.com
      VITE_SERVER_URL: wss://sise-api.example.com
      VITE_SERVER_HTTP_URL: https://sise-api.example.com
      TRAEFIK_WEB_RULE: Host(`sise.example.com`)
      TRAEFIK_SERVER_RULE: Host(`sise-api.example.com`)
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build server image with reusable layers
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: false
          load: true
          platforms: linux/amd64
          tags: sise-recovery-test:ci
          build-args: NODE_IMAGE=${{ env.NODE_IMAGE }}
          cache-from: type=gha,scope=sise-server
          cache-to: type=gha,mode=max,scope=sise-server

      - uses: actions/download-artifact@v8
        with:
          name: ci-bundle
      - name: Restore verified CI dependencies for the recovery SDK
        run: node scripts/ci/artifact.mjs restore
      - name: Verify native consumer compatibility
        run: npm run ci:consumer

      - name: Verify real container SIGTERM and room recovery
        env:
          RECOVERY_TEST_IMAGE: sise-recovery-test:ci
        run: node scripts/ci/record.mjs container-recovery -- node scripts/container-recovery-smoke.mjs

      - name: Build web image with reusable layers
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./client/Dockerfile
          push: false
          build-args: |
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            NGINX_IMAGE=${{ env.NGINX_IMAGE }}
            VITE_SERVER_URL=${{ env.VITE_SERVER_URL }}
            VITE_SERVER_HTTP_URL=${{ env.VITE_SERVER_HTTP_URL }}
          cache-from: type=gha,scope=sise-web
          cache-to: type=gha,mode=max,scope=sise-web

      - name: Retain release-contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-containers-${{ github.run_attempt }}
          path: output/ci-migration/
          if-no-files-found: error
          retention-days: 7

  legacy-comparison:
    name: "Migration comparison"
    if: github.event_name == 'workflow_dispatch' && inputs.migration_comparison && github.ref != 'refs/heads/main'
    uses: ./.github/workflows/ci-legacy.yml

  migration-stability:
    name: "Migration stability · ${{ matrix.project }}"
    if: github.event_name == 'workflow_dispatch' && inputs.migration_comparison && github.ref != 'refs/heads/main'
    needs: [build, unit, integration, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --shm-size=1g
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit-responsive]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@v8
        with:
          name: ci-bundle
      - run: node scripts/ci/artifact.mjs restore
      - run: npm run ci:consumer -- --browsers
      - name: Two bounded same-environment A/B then B/A rounds
        run: node scripts/ci/stability.mjs ${{ matrix.project }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-stability-${{ matrix.project }}-${{ github.run_attempt }}
          path: output/ci-migration/
          if-no-files-found: warn
          retention-days: 7

  ci-gate:
    name: CI gate
    if: always()
    needs: [configuration, dependency-audit, build, unit, integration, browser, container-build, legacy-comparison, migration-stability]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@v8
        if: github.event_name == 'workflow_dispatch' && inputs.migration_comparison && github.ref != 'refs/heads/main'
        with:
          name: ci-identity
          path: output/ci-migration/identity/new
      - uses: actions/download-artifact@v8
        if: github.event_name == 'workflow_dispatch' && inputs.migration_comparison && github.ref != 'refs/heads/main'
        with:
          name: legacy-identity
          path: output/ci-migration/identity/old
      - name: Compare actual same-head build identities
        if: github.event_name == 'workflow_dispatch' && inputs.migration_comparison && github.ref != 'refs/heads/main'
        run: node scripts/ci/compare-identity.mjs output/ci-migration/identity/new/ci-bundle.json output/ci-migration/identity/old/identity.json
      - uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'workflow_dispatch' && inputs.migration_comparison && github.ref != 'refs/heads/main'
        with:
          name: evidence-comparison-${{ github.run_attempt }}
          path: output/ci-migration/
          retention-days: 7
      - name: Require full coverage and distinguish intentional comparison omission
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUIRE_LEGACY: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_comparison && github.ref != 'refs/heads/main' }}
        run: |
          node scripts/ci/gate.mjs
