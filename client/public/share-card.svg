<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">邀请你一起传承四色牌文化</title>
  <desc id="desc">深蓝色背景上的四色牌标识与文化传承邀请文字</desc>
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientTransform="translate(270 130) rotate(30) scale(980 640)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18345a"/>
      <stop offset="0.58" stop-color="#0b172b"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="44" fill="url(#bg)"/>
  <circle cx="1040" cy="92" r="190" fill="#38bdf8" opacity=".06"/>
  <circle cx="1030" cy="600" r="270" fill="#22c55e" opacity=".05"/>
  <g transform="translate(82 92)" filter="url(#shadow)">
    <rect width="330" height="446" rx="42" fill="#111c31" stroke="#334155" stroke-width="4"/>
    <g transform="translate(50 66)" stroke="#e2e8f0" stroke-width="5">
      <rect width="44" height="310" rx="22" fill="#facc15"/>
      <rect x="62" width="44" height="310" rx="22" fill="#ef4444"/>
      <rect x="124" width="44" height="310" rx="22" fill="#22c55e"/>
      <rect x="186" width="44" height="310" rx="22" fill="#f8fafc"/>
    </g>
  </g>
  <g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
    <text x="474" y="148" fill="#fbbf24" font-size="28" font-weight="700" letter-spacing="7">好友邀请</text>
    <text x="472" y="244" fill="#f8fafc" font-size="64" font-weight="800">邀请你一起</text>
    <text x="472" y="332" fill="#f8fafc" font-size="64" font-weight="800">传承四色牌文化</text>
    <line x1="474" y1="388" x2="1090" y2="388" stroke="#334155" stroke-width="2"/>
    <text x="474" y="449" fill="#cbd5e1" font-size="29" font-weight="500">点击邀请卡，进入好友房同桌相聚</text>
    <text x="474" y="514" fill="#7dd3fc" font-size="25" font-weight="700" letter-spacing="5">象棋魂 · 麻将韵 · 纸牌趣</text>
  </g>
</svg>
