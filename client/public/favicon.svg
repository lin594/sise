<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">四色牌</title>
  <desc id="desc">黄帥、红相、绿車、白士四张圆头长牌，每张牌的两端各有一个繁体牌面字</desc>
  <defs>
    <linearGradient id="bg" x1="74" y1="42" x2="438" y2="474" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142d50"/>
      <stop offset=".58" stop-color="#081326"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-25%" width="160%" height="165%">
      <feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="102" cy="88" r="142" fill="#f59e0b" opacity=".055"/>
  <g filter="url(#shadow)" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="central">
    <g transform="rotate(-8 112 260)">
      <rect x="70" y="112" width="84" height="296" rx="42" fill="#f5c518" stroke="#fff6cf" stroke-width="7"/>
      <text x="112" y="174" fill="#17120a" font-size="54">帥</text>
      <text x="112" y="346" fill="#17120a" font-size="54" transform="rotate(180 112 346)">帥</text>
    </g>
    <g transform="rotate(-3 208 250)">
      <rect x="166" y="102" width="84" height="296" rx="42" fill="#e84545" stroke="#ffe2e2" stroke-width="7"/>
      <text x="208" y="164" fill="#180808" font-size="54">相</text>
      <text x="208" y="336" fill="#180808" font-size="54" transform="rotate(180 208 336)">相</text>
    </g>
    <g transform="rotate(3 304 250)">
      <rect x="262" y="102" width="84" height="296" rx="42" fill="#28b85c" stroke="#ddfbe8" stroke-width="7"/>
      <text x="304" y="164" fill="#07160c" font-size="54">車</text>
      <text x="304" y="336" fill="#07160c" font-size="54" transform="rotate(180 304 336)">車</text>
    </g>
    <g transform="rotate(8 400 260)">
      <rect x="358" y="112" width="84" height="296" rx="42" fill="#f7f4eb" stroke="#e2e8f0" stroke-width="7"/>
      <text x="400" y="174" fill="#111827" font-size="54">士</text>
      <text x="400" y="346" fill="#111827" font-size="54" transform="rotate(180 400 346)">士</text>
    </g>
  </g>
</svg>
